<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZONE // SHOOTER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'Share Tech Mono',monospace;overflow:hidden;width:100vw;height:100vh;user-select:none;touch-action:none;}

/* MENU */
#menu{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#071207,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#menu::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,80,.025) 2px,rgba(0,255,80,.025) 4px);pointer-events:none;}
.mtitle{font-family:'Orbitron',monospace;font-size:clamp(2.5rem,7vw,5rem);font-weight:900;color:#00ff50;letter-spacing:.3em;text-shadow:0 0 20px #00ff50,0 0 60px #00ff5055;animation:flicker 5s infinite;margin-bottom:.15em;}
.msub{color:#00ff5055;letter-spacing:.4em;font-size:.75rem;margin-bottom:.5rem;}
.mver{color:#00ff5035;font-size:.65rem;letter-spacing:.2em;margin-bottom:2.5rem;}
@keyframes flicker{0%,94%,100%{opacity:1}95%{opacity:.4}96%{opacity:1}98%{opacity:.3}}
.mbtn{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;letter-spacing:.2em;padding:.85rem 2.5rem;border:2px solid #00ff50;background:transparent;color:#00ff50;cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;transition:color .15s;margin:.35rem;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.mbtn::before{content:'';position:absolute;inset:0;background:#00ff50;transform:scaleX(0);transform-origin:left;transition:transform .15s;z-index:-1;}
.mbtn:hover{color:#000;}.mbtn:hover::before{transform:scaleX(1);}
.mbtn.pri{background:#00ff5012;}
.mctrl{position:absolute;bottom:1.2rem;color:#00ff5038;font-size:.68rem;letter-spacing:.1em;text-align:center;line-height:2.2;}

/* CANVAS */
#gc{display:none;position:absolute;inset:0;cursor:none;}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;display:none;}
.hc{position:absolute;padding:.75rem 1rem;color:#00ff50;font-size:.7rem;letter-spacing:.08em;}
.htl{top:0;left:0;} .htr{top:0;right:0;text-align:right;}
.hbar{width:130px;height:4px;background:#00ff5012;border:1px solid #00ff5035;margin-top:3px;overflow:hidden;}
.hbf{height:100%;background:linear-gradient(90deg,#ff2020,#ff8020 50%,#00ff50);background-size:300% 100%;transition:width .25s,background-position .25s;}
.hamo{font-size:1.3rem;font-family:'Orbitron',monospace;font-weight:700;}
.hamo span{font-size:.65rem;opacity:.4;}
#mm{position:absolute;top:.75rem;right:.75rem;width:108px;height:108px;border:1px solid #00ff5035;background:#00100acc;pointer-events:none;}
#mmc{width:100%;height:100%;}
#xh{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:11;display:none;}
#kf{position:absolute;top:4.2rem;right:.75rem;width:185px;pointer-events:none;display:flex;flex-direction:column;gap:3px;}
.ke{background:#00001580;border-left:2px solid #ff4040;padding:3px 7px;font-size:.66rem;color:#ff9090;animation:kfa 3s forwards;}
@keyframes kfa{0%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(16px)}}
#dbg{position:absolute;bottom:.5rem;left:.5rem;color:#00ff5055;font-size:.62rem;letter-spacing:.08em;line-height:1.7;pointer-events:none;}

/* DAMAGE */
#dv{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,#ff000050 100%);pointer-events:none;z-index:9;opacity:0;transition:opacity .12s;}

/* JOYSTICK */
#jz{position:absolute;bottom:28px;left:28px;width:128px;height:128px;pointer-events:all;z-index:20;display:none;}
#jb{position:absolute;inset:0;border-radius:50%;background:#00ff500e;border:1.5px solid #00ff5038;}
#js{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#00ff5055,#00ff5020);border:1.5px solid #00ff5070;top:50%;left:50%;transform:translate(-50%,-50%);}

/* BUTTONS */
#sbtn{position:absolute;bottom:38px;right:38px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff404055,#ff202020);border:1.5px solid #ff404075;font-family:'Orbitron',monospace;font-weight:700;color:#ff7070;font-size:.65rem;cursor:pointer;pointer-events:all;z-index:20;display:none;align-items:center;justify-content:center;touch-action:none;}
#sbtn:active{background:radial-gradient(circle at 35% 35%,#ff404090,#ff202055);}
#rbtn{position:absolute;bottom:136px;right:50px;width:52px;height:52px;border-radius:50%;background:#00ff5012;border:1.5px solid #00ff5055;font-family:'Share Tech Mono',monospace;color:#00ff50;font-size:.6rem;cursor:pointer;pointer-events:all;z-index:20;display:none;align-items:center;justify-content:center;}

/* RELOAD BAR */
#rlb{position:absolute;top:56%;left:50%;transform:translate(-50%,0);pointer-events:none;z-index:12;display:none;flex-direction:column;align-items:center;gap:4px;}
#rlbt{width:110px;height:4px;background:#00ff5018;border:1px solid #00ff5038;}
#rlbf{height:100%;width:0%;background:#00ff50;}
#rlbtx{font-size:.68rem;color:#00ff5090;letter-spacing:.18em;}

/* STATUS */
#st{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00ff50;font-size:.85rem;letter-spacing:.2em;z-index:200;display:none;text-align:center;}

/* DEATH */
#ds{display:none;position:absolute;inset:0;background:#00000092;z-index:50;align-items:center;justify-content:center;flex-direction:column;}
#ds h2{font-family:'Orbitron',monospace;color:#ff2040;font-size:clamp(1.6rem,5vw,2.8rem);text-shadow:0 0 25px #ff2040;margin-bottom:.7rem;animation:flicker 2s infinite;}
#ds p{color:#ff204065;font-size:.85rem;letter-spacing:.25em;}
</style>
</head>
<body>

<div id="menu">
  <div class="mtitle">// ZONE</div>
  <div class="msub">MULTIPLAYER · TOP-DOWN</div>
  <div class="mver" id="verLabel"></div>
  <button class="mbtn pri" onclick="startGame()">► ИГРАТЬ</button>
  <div class="mctrl">WASD / Джойстик — движение &nbsp;|&nbsp; Мышь / Кнопка — стрелять<br>R — перезарядка &nbsp;|&nbsp; ЛКМ — огонь</div>
</div>

<div id="st"></div>
<canvas id="gc"></canvas>

<div id="hud">
  <div class="hc htl">
    <div>HP</div>
    <div class="hbar"><div class="hbf" id="hpf" style="width:100%;background-position:right center;"></div></div>
    <div id="hpn" style="margin-top:3px;font-size:.75rem;">100</div>
  </div>
  <div class="hc htr">
    <div class="hamo" id="amh">30 <span>/ 90</span></div>
    <div style="opacity:.4;font-size:.62rem;margin-top:3px;">ПАТРОНЫ</div>
  </div>
  <div id="mm"><canvas id="mmc" width="108" height="108"></canvas></div>
  <div id="kf"></div>
  <div id="dbg"></div>
</div>

<div id="dv"></div>
<div id="xh">
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none" opacity=".8">
    <line x1="14" y1="2" x2="14" y2="10" stroke="#00ff50" stroke-width="1.5"/>
    <line x1="14" y1="18" x2="14" y2="26" stroke="#00ff50" stroke-width="1.5"/>
    <line x1="2" y1="14" x2="10" y2="14" stroke="#00ff50" stroke-width="1.5"/>
    <line x1="18" y1="14" x2="26" y2="14" stroke="#00ff50" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="2.5" stroke="#00ff50" stroke-width="1" fill="none" opacity=".45"/>
  </svg>
</div>

<div id="jz"><div id="jb"></div><div id="js"></div></div>
<button id="sbtn" onpointerdown="tryShoot()">ОГОНЬ</button>
<button id="rbtn" onclick="startReload()">RELOAD</button>

<div id="rlb">
  <div id="rlbtx">ПЕРЕЗАРЯДКА</div>
  <div id="rlbt"><div id="rlbf"></div></div>
</div>

<div id="ds"><h2>ВЫ УБИТЫ</h2><p id="rsp"></p></div>

<script>
// ═══════════════════════════════════════════
//  ZONE v1.0 — Top-Down Multiplayer Shooter
//  github.com/yarikk23012014-code
// ═══════════════════════════════════════════

// Version: базовая 1.0, каждый новый год +0.1
const BASE_VER = 1.0;
const BASE_YEAR = 2025;
const currentYear = new Date().getFullYear();
const VERSION = (BASE_VER + (currentYear - BASE_YEAR) * 0.1).toFixed(1);
document.getElementById('verLabel').textContent = `v${VERSION}`;

// Supabase
const SB_URL = 'https://expysxwfhielbkbpbrbb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cHlzeHdmaGllbGJrYnBicmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTQ5NjksImV4cCI6MjA5NTI3MDk2OX0.mHuW7K2zBL5MrH7t0lwBS9rTvAUTm-5y3gSCX1TBjrM';

// Constants
const TILE=48, MW=32, MH=24;
const SPD=3.0, PR=14;
const BS=10, BDmg=25, BL=70;
const MHP=100, MAM=30, MRS=90, RLD=2000;
const COLS=['#00e5ff','#ff5722','#e91e63','#8bc34a','#ffc107','#9c27b0','#03a9f4','#ff9800','#00bcd4','#ff1744'];

let sb = null;

// Map generation (deterministic)
function rng32(a){
  return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
function makeMap(seed){
  const r=rng32(seed);
  const m=Array.from({length:MH},(_,y)=>Array.from({length:MW},(_,x)=>(x===0||y===0||x===MW-1||y===MH-1)?1:0));
  for(let i=0;i<85;i++){
    const bx=1+Math.floor(r()*(MW-2)), by=1+Math.floor(r()*(MH-2));
    if(Math.abs(bx-MW/2)<3&&Math.abs(by-MH/2)<3)continue;
    m[by][bx]=1;
  }
  for(let i=0;i<22;i++){
    const bx=2+Math.floor(r()*(MW-5)), by=2+Math.floor(r()*(MH-5));
    if(Math.abs(bx-MW/2)<4&&Math.abs(by-MH/2)<4)continue;
    m[by][bx]=1;
    if(r()>.5&&bx+1<MW-1)m[by][bx+1]=1;
    if(r()>.5&&by+1<MH-1)m[by+1][bx]=1;
  }
  return m;
}
const MAP = makeMap(7777);

function wallAt(wx,wy){
  const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE);
  if(tx<0||ty<0||tx>=MW||ty>=MH)return true;
  return MAP[ty]?.[tx]===1;
}
function hits(cx,cy,r){
  return[[cx-r,cy],[cx+r,cy],[cx,cy-r],[cx,cy+r],
    [cx-r*.7,cy-r*.7],[cx+r*.7,cy-r*.7],[cx-r*.7,cy+r*.7],[cx+r*.7,cy+r*.7]
  ].some(([x,y])=>wallAt(x,y));
}
function spawn(){
  const seed=(Date.now()^Math.floor(Math.random()*0xFFFFFF))&0xFFFFFFF; const r=rng32(seed);
  for(let i=0;i<400;i++){
    const tx=1+Math.floor(r()*(MW-2)), ty=1+Math.floor(r()*(MH-2));
    if(MAP[ty]?.[tx]===0)return{x:tx*TILE+TILE/2, y:ty*TILE+TILE/2};
  }
  return{x:TILE*2.5, y:TILE*2.5};
}

// State
const myId='p'+Math.random().toString(36).slice(2,8).toUpperCase();
let players={}, bullets=[];
let keys={}, mouse={x:0,y:0};
let camX=0, camY=0;
let myAmmo=MAM, myRes=MRS;
let reloading=false, reloadAt=0, shootAt=0;
let jDx=0, jDy=0, jActive=false, jId=-1, jBx=0, jBy=0;
let running=false;
let tSync=0, tPlayers=0, tBullets=0, tHits=0;
let dbgTxt='';

const cv=document.getElementById('gc');
const cx2=cv.getContext('2d');
const mc=document.getElementById('mmc');
const mx=mc.getContext('2d');

// HUD
function setHP(v){
  const p=Math.max(0,v)/MHP*100;
  document.getElementById('hpf').style.width=p+'%';
  document.getElementById('hpf').style.backgroundPosition=(100-p)+'% center';
  document.getElementById('hpn').textContent=Math.max(0,Math.round(v));
}
function setAm(){document.getElementById('amh').innerHTML=`${myAmmo} <span>/ ${myRes}</span>`;}
function flashDmg(){const v=document.getElementById('dv');v.style.opacity='1';setTimeout(()=>v.style.opacity='0',200);}
function kfeed(msg){
  const f=document.getElementById('kf'),e=document.createElement('div');
  e.className='ke';e.textContent=msg;f.appendChild(e);
  setTimeout(()=>e.remove(),3000);
}

// Joystick
function setupJoy(){
  const zone=document.getElementById('jz'), stick=document.getElementById('js'), R=50;
  const on=(e)=>{
    e.preventDefault();
    const t=e.changedTouches?e.changedTouches[0]:e;
    const rc=zone.getBoundingClientRect();
    jBx=rc.left+rc.width/2; jBy=rc.top+rc.height/2;
    jId=t.identifier??-1; jActive=true;
  };
  const mv=(e)=>{
    e.preventDefault(); if(!jActive)return;
    const arr=e.changedTouches??[e];
    for(const t of arr){
      if(e.changedTouches&&(t.identifier??-1)!==jId)continue;
      let dx=t.clientX-jBx, dy=t.clientY-jBy;
      const d=Math.hypot(dx,dy);
      if(d>R){dx=dx/d*R;dy=dy/d*R;}
      stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
      jDx=dx/R; jDy=dy/R;
    }
  };
  const off=(e)=>{e.preventDefault();jActive=false;jDx=0;jDy=0;stick.style.transform='translate(-50%,-50%)';};
  zone.addEventListener('touchstart',on,{passive:false});
  zone.addEventListener('mousedown',on);
  window.addEventListener('touchmove',mv,{passive:false});
  window.addEventListener('mousemove',mv);
  window.addEventListener('touchend',off);
  window.addEventListener('mouseup',off);
}

function setupInput(){
  window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')startReload();});
  window.addEventListener('keyup',e=>keys[e.code]=false);
  cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  cv.addEventListener('mousedown',e=>{if(e.button===0)tryShoot();});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  setupJoy();
}

function tryShoot(){
  const me=players[myId];
  if(!me||!me.alive||reloading)return;
  if(myAmmo<=0){startReload();return;}
  const now=Date.now();
  if(now-shootAt<135)return;
  shootAt=now; myAmmo--; setAm();
  const W=cv.width/2, H=cv.height/2;
  const ang=(jActive&&(jDx||jDy))?Math.atan2(jDy,jDx):Math.atan2(mouse.y-H,mouse.x-W);
  const b={
    id:myId+'_'+now,
    oid:myId,
    x:me.x+Math.cos(ang)*(PR+6),
    y:me.y+Math.sin(ang)*(PR+6),
    vx:Math.cos(ang)*BS,
    vy:Math.sin(ang)*BS,
    life:BL,
    ts:now
  };
  bullets.push(b);
  // Push bullet to Supabase
  sb.from('bullets').upsert({id:b.id,data:b,created_at:new Date().toISOString()}).then(({error})=>{
    if(error)console.warn('bullet push error:',error.message);
  });
}

function startReload(){
  if(reloading||myRes<=0||myAmmo===MAM)return;
  reloading=true; reloadAt=Date.now();
  document.getElementById('rlb').style.display='flex';
}

// Supabase helpers
let errCount=0;
async function pushMe(){
  const me=players[myId];if(!me)return;
  try{
    const{error}=await sb.from('players').upsert({id:myId,data:me,updated_at:new Date().toISOString()});
    if(error)throw new Error(error.message);
    if(errCount>0){errCount=0;document.getElementById('dbg').style.color='#00ff5055';}
  }catch(e){
    errCount++;
    if(errCount===1)document.getElementById('dbg').style.color='#ff404080';
  }
}

async function fetchPlayers(){
  // Auto-clean stale players from DB (older than 10s)
  sb.from('players').delete().lt('updated_at', new Date(Date.now()-10000).toISOString()).then();
  const{data,error}=await sb.from('players').select('id,data,updated_at');
  if(error){console.warn('fetchPlayers:',error.message);return;}
  const now=Date.now();
  for(const id of Object.keys(players)){
    if(id===myId)continue;
    if(!data.find(r=>r.id===id))delete players[id];
  }
  for(const row of data){
    if(row.id===myId)continue;
    const age=now-new Date(row.updated_at).getTime();
    if(age<10000){
      const incoming=row.data;
      if(players[row.id]){
        // Smooth interpolation instead of teleport
        players[row.id].tx=incoming.x;
        players[row.id].ty=incoming.y;
        players[row.id].angle=incoming.angle;
        players[row.id].hp=incoming.hp;
        players[row.id].alive=incoming.alive;
        players[row.id].color=incoming.color;
        players[row.id].name=incoming.name;
      } else {
        players[row.id]={...incoming, tx:incoming.x, ty:incoming.y};
      }
    } else {
      delete players[row.id];
      sb.from('players').delete().eq('id',row.id).then();
    }
  }
  const others=Object.keys(players).filter(i=>i!==myId).length;
  dbgTxt='v'+VERSION+' | ID:'+myId+' | ИГРОКОВ:'+Object.keys(players).length+' | ДРУГИХ:'+others;
}

async function fetchBullets(){
  const{data,error}=await sb.from('bullets').select('id,data');
  if(error){console.warn('fetchBullets:',error.message);return;}
  const now=Date.now();
  for(const row of data){
    const b=row.data;
    if(!b||b.oid===myId)continue;
    if(now-b.ts>2500){
      sb.from('bullets').delete().eq('id',row.id).then();
      continue;
    }
    if(!bullets.find(x=>x.id===b.id))bullets.push({...b,ext:true});
  }
}

let doneHits=new Set();
async function fetchHits(){
  const{data,error}=await sb.from('hits').select('*').eq('target_id',myId);
  if(error){console.warn('fetchHits:',error.message);return;}
  if(!data)return;
  for(const row of data){
    if(doneHits.has(row.id))continue;
    doneHits.add(row.id);
    applyDmg(row.data.dmg, row.data.from);
    sb.from('hits').delete().eq('id',row.id).then();
  }
}

function applyDmg(dmg, fromId){
  const me=players[myId];
  if(!me||!me.alive)return;
  me.hp-=dmg; flashDmg(); setHP(me.hp);
  kfeed(`⚡ Получил ${dmg} урона`);
  if(me.hp<=0)die();
}

function die(){
  const me=players[myId];if(!me)return;
  me.alive=false;
  document.getElementById('ds').style.display='flex';
  let t=5;
  document.getElementById('rsp').textContent=`ВОЗРОЖДЕНИЕ ЧЕРЕЗ ${t}...`;
  const iv=setInterval(()=>{
    t--;
    if(t<=0){clearInterval(iv);respawn();}
    else document.getElementById('rsp').textContent=`ВОЗРОЖДЕНИЕ ЧЕРЕЗ ${t}...`;
  },1000);
}

function respawn(){
  const p=spawn(), me=players[myId];
  Object.assign(me,{x:p.x,y:p.y,hp:MHP,alive:true});
  myAmmo=MAM;myRes=MRS;reloading=false;
  setHP(MHP);setAm();
  document.getElementById('ds').style.display='none';
  document.getElementById('rlb').style.display='none';
}

// Draw
const FL=['#0b160b','#0c180c','#0d1a0d'];
function draw(){
  const W=cv.width, H=cv.height;
  cx2.clearRect(0,0,W,H);
  cx2.save();
  cx2.translate(-camX,-camY);

  // Floor
  for(let ty=0;ty<MH;ty++) for(let tx=0;tx<MW;tx++){
    if(MAP[ty][tx]===0){
      cx2.fillStyle=FL[(tx+ty)%3];
      cx2.fillRect(tx*TILE,ty*TILE,TILE,TILE);
      cx2.strokeStyle='#1a301a18';cx2.lineWidth=.5;
      cx2.strokeRect(tx*TILE,ty*TILE,TILE,TILE);
    }
  }

  // Walls (fake 3D top-down look)
  for(let ty=0;ty<MH;ty++) for(let tx=0;tx<MW;tx++){
    if(MAP[ty][tx]!==1)continue;
    const wx=tx*TILE, wy=ty*TILE;
    // South shadow face
    cx2.fillStyle='#09160980';
    cx2.fillRect(wx,wy+TILE,TILE,16);
    // East shadow face
    cx2.fillStyle='#0b1a0b70';
    cx2.fillRect(wx+TILE,wy,16,TILE);
    // Top face
    cx2.fillStyle='#183018';
    cx2.fillRect(wx,wy,TILE,TILE);
    // Top detail
    cx2.fillStyle='#1f3e1f';
    cx2.fillRect(wx+3,wy+3,TILE-6,TILE-6);
    cx2.strokeStyle='#2a5a2a45';cx2.lineWidth=1;
    cx2.strokeRect(wx+3,wy+3,TILE-6,TILE-6);
  }

  // Bullets
  for(const b of bullets){
    const own=b.oid===myId;
    cx2.save();
    cx2.shadowColor=own?'#ffe040':'#ff5050';cx2.shadowBlur=10;
    cx2.fillStyle=own?'#fff080':'#ff8080';
    cx2.beginPath();cx2.arc(b.x,b.y,3.5,0,Math.PI*2);cx2.fill();
    cx2.globalAlpha=.3;cx2.fillStyle=own?'#ffd000':'#ff3030';
    cx2.beginPath();cx2.arc(b.x-b.vx*2.2,b.y-b.vy*2.2,2,0,Math.PI*2);cx2.fill();
    cx2.restore();
  }

  // Players
  for(const[id,p]of Object.entries(players))
    if(p&&p.alive)drawP(p,id===myId);

  cx2.restore();

  // Reload progress
  if(reloading){
    const pct=Math.min(1,(Date.now()-reloadAt)/RLD);
    document.getElementById('rlbf').style.width=(pct*100)+'%';
    if(pct>=1){
      reloading=false;
      const need=MAM-myAmmo, take=Math.min(need,myRes);
      myAmmo+=take;myRes-=take;setAm();
      document.getElementById('rlb').style.display='none';
    }
  }

  // Debug text
  document.getElementById('dbg').textContent=dbgTxt;

  drawMM();
}

function drawP(p,isMe){
  cx2.save();cx2.translate(p.x,p.y);
  // Drop shadow
  cx2.beginPath();cx2.ellipse(4,8,PR,PR*.42,0,0,Math.PI*2);
  cx2.fillStyle='#00000050';cx2.fill();
  // Glow
  if(isMe){cx2.shadowColor=p.color;cx2.shadowBlur=16;}
  // Body
  cx2.beginPath();cx2.arc(0,0,PR,0,Math.PI*2);
  cx2.fillStyle=p.color;cx2.fill();
  cx2.strokeStyle=isMe?'#ffffffcc':'#ffffff45';
  cx2.lineWidth=isMe?2:1.5;cx2.stroke();
  // Gun barrel
  cx2.rotate(p.angle);
  cx2.fillStyle=isMe?'#ffffffee':'#ffffff60';
  cx2.fillRect(PR-3,-2.5,15,5);
  cx2.fillStyle=isMe?'#cccccc':'#aaaaaa50';
  cx2.fillRect(PR+10,-1.5,5,3);
  cx2.rotate(-p.angle);
  // Center dot
  cx2.beginPath();cx2.arc(0,0,3.5,0,Math.PI*2);
  cx2.fillStyle=isMe?'#fff':'#ffffff60';cx2.fill();
  // HP bar for others
  if(!isMe){
    const bw=34;
    cx2.fillStyle='#00000065';cx2.fillRect(-bw/2,-PR-13,bw,5);
    const hp=Math.max(0,p.hp)/MHP;
    cx2.fillStyle=hp>.5?'#00ff50':hp>.25?'#ff8020':'#ff2020';
    cx2.fillRect(-bw/2,-PR-13,bw*hp,5);
  }
  // Name tag
  cx2.font='8.5px Share Tech Mono';cx2.textAlign='center';
  cx2.fillStyle=isMe?p.color:'#ffffff65';
  cx2.fillText(p.name||'???',0,-PR-17);
  cx2.restore();
}

function drawMM(){
  const sc=108/(MW*TILE);
  mx.clearRect(0,0,108,108);
  mx.fillStyle='#00100acc';mx.fillRect(0,0,108,108);
  for(let ty=0;ty<MH;ty++) for(let tx=0;tx<MW;tx++){
    if(MAP[ty][tx]===1){mx.fillStyle='#254a25';mx.fillRect(tx*TILE*sc,ty*TILE*sc,TILE*sc,TILE*sc);}
  }
  for(const[id,p]of Object.entries(players)){
    if(!p||!p.alive)continue;
    mx.beginPath();mx.arc(p.x*sc,p.y*sc,id===myId?4:3,0,Math.PI*2);
    mx.fillStyle=id===myId?'#00ff50':p.color;mx.fill();
    if(id===myId){
      mx.strokeStyle='#00ff5055';mx.lineWidth=1.5;
      mx.beginPath();mx.arc(p.x*sc,p.y*sc,6,0,Math.PI*2);mx.stroke();
    }
  }
}

// Game loop
let ltSync=0,ltPlayers=0,ltBullets=0,ltHits=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!running)return;

  const me=players[myId];

  // Movement
  if(me&&me.alive){
    let dx=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0)+jDx;
    let dy=(keys['KeyS']||keys['ArrowDown']?1:0)-(keys['KeyW']||keys['ArrowUp']?1:0)+jDy;
    const len=Math.hypot(dx,dy);
    if(len>1){dx/=len;dy/=len;}
    if(dx||dy){
      const nx=me.x+dx*SPD, ny=me.y+dy*SPD;
      if(!hits(nx,me.y,PR-1))me.x=nx;
      if(!hits(me.x,ny,PR-1))me.y=ny;
      if(jActive)me.angle=Math.atan2(dy,dx);
    }
    if(!jActive)me.angle=Math.atan2(mouse.y-cv.height/2,mouse.x-cv.width/2);
    camX=me.x-cv.width/2;
    camY=me.y-cv.height/2;
  }

  // Interpolate other players smoothly
  for(const[id,p] of Object.entries(players)){
    if(id===myId||!p)continue;
    if(p.tx!==undefined){
      p.x+=(p.tx-p.x)*0.2;
      p.y+=(p.ty-p.y)*0.2;
    }
  }

  // Bullet update + collision
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(wallAt(b.x,b.y)||b.life<=0){bullets.splice(i,1);continue;}
    // My bullet hits others
    if(b.oid===myId){
      for(const[pid,p]of Object.entries(players)){
        if(pid===myId||!p||!p.alive)continue;
        if(Math.hypot(b.x-p.x,b.y-p.y)<PR){
          bullets.splice(i,1);
          const hitId='h'+myId+Date.now()+Math.random().toString(36).slice(2,4);
          sb.from('hits').upsert({
            id:hitId,
            target_id:pid,
            data:{from:myId,dmg:BDmg,t:Date.now()},
            created_at:new Date().toISOString()
          }).then(({error})=>{if(error)console.warn('hit push:',error.message);});
          kfeed('► Попал в '+(p.name||pid));
          break;
        }
      }
    }
  }

  // Periodic sync
  if(now-ltSync>500){ltSync=now;pushMe();}
  if(now-ltPlayers>1500){ltPlayers=now;fetchPlayers();}
  if(now-ltBullets>1000){ltBullets=now;fetchBullets();}
  if(now-ltHits>800){ltHits=now;fetchHits();}

  draw();
}

function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}

async function startGame(){
  const st=document.getElementById('st');
  st.style.display='block';
  st.style.color='#00ff50';
  st.textContent='ПОДКЛЮЧЕНИЕ К СЕРВЕРУ...';
  document.getElementById('menu').style.display='none';

  try{
    sb=supabase.createClient(SB_URL,SB_KEY,{
      auth:{persistSession:false}
    });
    // Test connection
    const{error}=await sb.from('players').select('id').limit(1);
    if(error)throw error;
    st.textContent='✓ ПОДКЛЮЧЕНО';
    setTimeout(()=>st.style.display='none',1200);
  }catch(e){
    st.style.color='#ff4040';
    st.textContent='✗ ОШИБКА: '+e.message;
    console.error('Supabase error:',e);
    return;
  }

  cv.style.display='block';
  document.getElementById('hud').style.display='block';
  document.getElementById('xh').style.display='block';
  document.getElementById('jz').style.display='block';
  document.getElementById('sbtn').style.display='flex';
  document.getElementById('rbtn').style.display='flex';

  resize();
  window.addEventListener('resize',resize);

  const pos=spawn();
  const ci=myId.charCodeAt(1)%COLS.length;
  players[myId]={
    id:myId,x:pos.x,y:pos.y,hp:MHP,
    angle:0,color:COLS[ci],alive:true,
    name:'P_'+myId.slice(-4)
  };
  camX=pos.x-window.innerWidth/2;
  camY=pos.y-window.innerHeight/2;

  setHP(MHP);setAm();setupInput();
  running=true;
  requestAnimationFrame(loop);

  window.addEventListener('beforeunload',()=>{
    sb.from('players').delete().eq('id',myId).then();
  });
}
</script>
