@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'Share Tech Mono',monospace;overflow:hidden;width:100vw;height:100vh;user-select:none;touch-action:none;}

@keyframes kfade{0%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0;transform:translateX(18px)}}

#shootBtn{position:absolute;bottom:40px;right:40px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff404060,#ff202025);border:2px solid #ff404080;font-family:'Orbitron',monospace;font-weight:700;color:#ff6060;font-size:.7rem;cursor:pointer;pointer-events:all;z-index:20;display:none;align-items:center;justify-content:center;}
#shootBtn:active{background:radial-gradient(circle at 35% 35%,#ff4040aa,#ff202060);}
#reloadBtn{position:absolute;bottom:140px;right:55px;width:55px;height:55px;border-radius:50%;background:#00ff5015;border:2px solid #00ff5060;font-family:'Share Tech Mono',monospace;color:#00ff50;font-size:.65rem;cursor:pointer;pointer-events:all;z-index:20;display:none;align-items:center;justify-content:center;}
#death{display:none;position:absolute;inset:0;background:#00000095;z-index:50;align-items:center;justify-content:center;flex-direction:column;}
#death h2{font-family:'Orbitron',monospace;color:#ff2040;font-size:clamp(1.8rem,5vw,3rem);text-shadow:0 0 30px #ff2040;margin-bottom:.8rem;animation:flicker 2s infinite;}
#respawn{color:#ff204070;font-size:.9rem;letter-spacing:.3em;}
#reloadBar{position:absolute;top:55%;left:50%;transform:translate(-50%,0);pointer-events:none;z-index:12;display:none;flex-direction:column;align-items:center;gap:5px;}
#rBarTrack{width:120px;height:5px;background:#00ff5020;border:1px solid #00ff5040;}
#rBarFill{height:100%;width:0%;background:#00ff50;transition:width .05s;}
#rBarText{font-size:.7rem;color:#00ff50;letter-spacing:.2em;}
#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00ff50;font-size:.9rem;letter-spacing:.2em;z-index:200;display:none;}
</style>

<script>
const SUPABASE_URL = 'https://expysxwfhielbkbpbrbb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cHlzeHdmaGllbGJrYnBicmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTQ5NjksImV4cCI6MjA5NTI3MDk2OX0.mHuW7K2zBL5MrH7t0lwBS9rTvAUTm-5y3gSCX1TBjrM';

const TILE=48,MAP_W=32,MAP_H=24;
const PSPEED=3.2,BRAD=14;
const BSPEED=10,BDmg=25,BLIFE=72;
const PHP=100,AMMO=30,RESERVE=90,RELOAD_MS=2000;
const COLORS=['#00e5ff','#ff5722','#e91e63','#8bc34a','#ffc107','#9c27b0','#03a9f4','#ff9800','#00ff50','#ff1744'];

let sb = null;

function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

function buildMap(seed){
  const rng=mulberry32(seed);
  const m=Array.from({length:MAP_H},(_,y)=>Array.from({length:MAP_W},(_,x)=>(x===0||y===0||x===MAP_W-1||y===MAP_H-1)?1:0));
  for(let i=0;i<90;i++){
    const bx=Math.floor(rng()*(MAP_W-4))+2,by=Math.floor(rng()*(MAP_H-4))+2;
    if(Math.abs(bx-MAP_W/2)<3&&Math.abs(by-MAP_H/2)<3)continue;
    m[by][bx]=1;
  }
  for(let i=0;i<25;i++){
    const bx=Math.floor(rng()*(MAP_W-6))+3,by=Math.floor(rng()*(MAP_H-6))+3;
    if(Math.abs(bx-MAP_W/2)<4&&Math.abs(by-MAP_H/2)<4)continue;
    m[by][bx]=1;
    if(rng()>.5)m[by][bx+1]=1;
    if(rng()>.5)m[by+1][bx]=1;
  }
  return m;
}

const MAP_SEED=12345;
const map=buildMap(MAP_SEED);

function isWall(wx,wy){
  const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return true;
  return map[ty]?.[tx]===1;
}
function collidesMap(cx,cy,r){
  return[[cx-r,cy],[cx+r,cy],[cx,cy-r],[cx,cy+r],[cx-r*.7,cy-r*.7],[cx+r*.7,cy-r*.7],[cx-r*.7,cy+r*.7],[cx+r*.7,cy+r*.7]].some(([px,py])=>isWall(px,py));
}
function randSpawn(){
  const rng=mulberry32(Date.now()&0xFFFFFF);
  for(let i=0;i<300;i++){
    const tx=Math.floor(rng()*(MAP_W-2))+1,ty=Math.floor(rng()*(MAP_H-2))+1;
    if(map[ty]?.[tx]===0)return{x:tx*TILE+TILE/2,y:ty*TILE+TILE/2};
  }
  return{x:TILE*3,y:TILE*3};
}

const myId='p_'+Math.random().toString(36).slice(2,9);
let players={},bullets=[],keys={},mouse={x:0,y:0};
let camX=0,camY=0,myAmmo=AMMO,myRes=RESERVE;
let reloading=false,reloadStart=0,shootCD=0;
let joyDx=0,joyDy=0,joyActive=false,joyId=-1,joyBX=0,joyBY=0;
let gameRunning=false;
let lastSync=0,lastPoll=0,lastBPoll=0,lastHPoll=0;

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const mmC=document.getElementById('mmCanvas');
const mmX=mmC.getContext('2d');

function setHP(hp){
  const p=Math.max(0,hp)/PHP*100;
  document.getElementById('hpFill').style.width=p+'%';
  document.getElementById('hpFill').style.backgroundPosition=(100-p)+'% center';
  document.getElementById('hpNum').textContent=Math.max(0,Math.round(hp));
}
function setAmmo(){document.getElementById('ammoHud').innerHTML=`${myAmmo} <span>/ ${myRes}</span>`;}
function flashDmg(){const v=document.getElementById('dmgv');v.style.opacity='1';setTimeout(()=>v.style.opacity='0',200);}
function killfeed(msg){
  const f=document.getElementById('kfeed'),el=document.createElement('div');
  el.className='ke';el.textContent=msg;f.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// Joystick
function setupJoystick(){
  const zone=document.getElementById('joyZone'),stick=document.getElementById('joyStick'),R=52;
  function jS(e){
    e.preventDefault();
    const t=e.changedTouches?e.changedTouches[0]:e;
    const rect=zone.getBoundingClientRect();
    joyBX=rect.left+rect.width/2;joyBY=rect.top+rect.height/2;
    joyId=t.identifier??-1;joyActive=true;
  }
  function jM(e){
    e.preventDefault();if(!joyActive)return;
    const touches=e.changedTouches??[e];
    for(const t of touches){
      if(e.changedTouches&&(t.identifier??-1)!==joyId)continue;
      let dx=t.clientX-joyBX,dy=t.clientY-joyBY;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>R){dx=dx/d*R;dy=dy/d*R;}
      stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
      joyDx=dx/R;joyDy=dy/R;
    }
  }
  function jE(e){e.preventDefault();joyActive=false;joyDx=0;joyDy=0;stick.style.transform='translate(-50%,-50%)';}
  zone.addEventListener('touchstart',jS,{passive:false});
  zone.addEventListener('mousedown',jS);
  window.addEventListener('touchmove',jM,{passive:false});
  window.addEventListener('mousemove',jM);
  window.addEventListener('touchend',jE);
  window.addEventListener('mouseup',jE);
}

function setupInput(){
  document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')startReload();});
  document.addEventListener('keyup',e=>keys[e.code]=false);
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  canvas.addEventListener('mousedown',e=>{if(e.button===0)tryShoot();});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  setupJoystick();
}

function tryShoot(){
  const me=players[myId];
  if(!me||!me.alive||reloading)return;
  if(myAmmo<=0){startReload();return;}
  const now=Date.now();
  if(now-shootCD<130)return;
  shootCD=now;myAmmo--;setAmmo();
  const scx=canvas.width/2,scy=canvas.height/2;
  const angle=(joyActive&&(joyDx||joyDy))?Math.atan2(joyDy,joyDx):Math.atan2(mouse.y-scy,mouse.x-scx);
  const b={id:myId+'_'+now+'_'+Math.random().toString(36).slice(2,5),ownerId:myId,x:me.x+Math.cos(angle)*(BRAD+5),y:me.y+Math.sin(angle)*(BRAD+5),vx:Math.cos(angle)*BSPEED,vy:Math.sin(angle)*BSPEED,life:BLIFE,ts:now};
  bullets.push(b);
  sb.from('bullets').upsert({id:b.id,data:b,created_at:new Date().toISOString()}).then();
}

function startReload(){
  if(reloading||myRes<=0||myAmmo===AMMO)return;
  reloading=true;reloadStart=Date.now();
  document.getElementById('reloadBar').style.display='flex';
}

async function pushPlayer(){
  const me=players[myId];if(!me)return;
  await sb.from('players').upsert({id:myId,data:me,updated_at:new Date().toISOString()});
}

let processedHits=new Set();
async function pollHits(){
  try{
    const{data}=await sb.from('hits').select('*').eq('target_id',myId);
    if(!data)return;
    for(const r of data){
      if(processedHits.has(r.id))continue;
      processedHits.add(r.id);
      applyDmg(r.data.dmg);
      await sb.from('hits').delete().eq('id',r.id);
    }
  }catch(e){}
}

async function pollBullets(){
  try{
    const{data}=await sb.from('bullets').select('*');
    if(!data)return;
    const now=Date.now();
    for(const r of data){
      const b=r.data;
      if(b.ownerId===myId)continue;
      if(now-b.ts>3000){await sb.from('bullets').delete().eq('id',r.id);continue;}
      if(!bullets.find(x=>x.id===b.id))bullets.push({...b,external:true});
    }
  }catch(e){}
}

async function pollPlayers(){
  try{
    const{data}=await sb.from('players').select('*');
    if(!data)return;
    const now=Date.now();
    // Remove stale
    for(const id of Object.keys(players)){
      if(id===myId)continue;
      const row=data.find(r=>r.id===id);
      if(!row||now-new Date(row.updated_at).getTime()>8000)delete players[id];
    }
    // Add/update
    for(const r of data){
      if(r.id===myId)continue;
      if(now-new Date(r.updated_at).getTime()<8000)players[r.id]=r.data;
    }
  }catch(e){}
}

function applyDmg(dmg){
  const me=players[myId];if(!me||!me.alive)return;
  me.hp-=dmg;flashDmg();setHP(me.hp);
  if(me.hp<=0)die();
}

function die(){
  const me=players[myId];if(!me)return;
  me.alive=false;
  document.getElementById('death').style.display='flex';
  let t=5;
  document.getElementById('respawn').textContent=`ВОЗРОЖДЕНИЕ ЧЕРЕЗ ${t}...`;
  const iv=setInterval(()=>{t--;if(t<=0){clearInterval(iv);respawn();}else document.getElementById('respawn').textContent=`ВОЗРОЖДЕНИЕ ЧЕРЕЗ ${t}...`;},1000);
}

function respawn(){
  const pos=randSpawn(),me=players[myId];
  me.x=pos.x;me.y=pos.y;me.hp=PHP;me.alive=true;
  myAmmo=AMMO;myRes=RESERVE;reloading=false;
  setHP(PHP);setAmmo();
  document.getElementById('death').style.display='none';
  document.getElementById('reloadBar').style.display='none';
}

// Draw
const FLOOR=['#0c180c','#0d1a0d','#0e1c0e'];
function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(-camX,-camY);

  // Floor
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    if(map[ty][tx]===0){
      ctx.fillStyle=FLOOR[(tx+ty)%3];ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);
      ctx.strokeStyle='#1a301a20';ctx.lineWidth=.5;ctx.strokeRect(tx*TILE,ty*TILE,TILE,TILE);
    }
  }
  // Walls
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    if(map[ty][tx]!==1)continue;
    const wx=tx*TILE,wy=ty*TILE;
    ctx.fillStyle='#0d200d';ctx.fillRect(wx,wy+TILE,TILE,18);
    ctx.fillStyle='#112a11';ctx.fillRect(wx+TILE,wy,18,TILE);
    ctx.fillStyle='#1a3a1a';ctx.fillRect(wx,wy,TILE,TILE);
    ctx.strokeStyle='#2a5a2a50';ctx.lineWidth=1;ctx.strokeRect(wx+2,wy+2,TILE-4,TILE-4);
    ctx.fillStyle='#3a6a3a60';ctx.fillRect(wx+4,wy+4,8,8);
  }
  // Bullets
  for(const b of bullets){
    const own=b.ownerId===myId;
    ctx.save();ctx.shadowColor=own?'#ffff40':'#ff6060';ctx.shadowBlur=8;
    ctx.fillStyle=own?'#ffff90':'#ff9090';
    ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.3;ctx.fillStyle=own?'#ffff00':'#ff4040';
    ctx.beginPath();ctx.arc(b.x-b.vx*2,b.y-b.vy*2,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // Players
  for(const[pid,p]of Object.entries(players))if(p.alive)drawPlayer(p,pid===myId);
  ctx.restore();

  // Reload bar update
  if(reloading){
    const pct=Math.min(1,(Date.now()-reloadStart)/RELOAD_MS);
    document.getElementById('rBarFill').style.width=(pct*100)+'%';
    if(pct>=1){reloading=false;const need=AMMO-myAmmo,take=Math.min(need,myRes);myAmmo+=take;myRes-=take;setAmmo();document.getElementById('reloadBar').style.display='none';}
  }

  drawMM();

  // Debug overlay
  const allP = Object.keys(players).length;
  const others = Object.keys(players).filter(id=>id!==myId).length;
  ctx.fillStyle = '#00ff5080';
  ctx.font = '11px Share Tech Mono';
  ctx.textAlign = 'left';
  ctx.fillText(`МОЙ ID: ${myId.slice(-6)}`, 10, canvas.height - 40);
  ctx.fillText(`ИГРОКОВ В БД: ${allP} | ДРУГИХ: ${others}`, 10, canvas.height - 24);
}

function drawPlayer(p,isMe){
  ctx.save();ctx.translate(p.x,p.y);
  // Shadow
  ctx.beginPath();ctx.ellipse(3,7,BRAD,BRAD*.45,0,0,Math.PI*2);ctx.fillStyle='#00000055';ctx.fill();
  // Body
  if(isMe){ctx.shadowColor=p.color;ctx.shadowBlur=14;}
  ctx.beginPath();ctx.arc(0,0,BRAD,0,Math.PI*2);
  ctx.fillStyle=isMe?p.color:p.color+'99';ctx.fill();
  ctx.strokeStyle=isMe?'#fff':'#ffffff55';ctx.lineWidth=isMe?2:1.5;ctx.stroke();
  // Gun
  ctx.rotate(p.angle);
  ctx.fillStyle=isMe?'#ffffffdd':'#ffffff66';ctx.fillRect(BRAD-3,-3,16,6);
  ctx.fillStyle=isMe?'#fff':'#ffffff55';ctx.fillRect(BRAD+10,-2,5,4);
  ctx.rotate(-p.angle);
  // Center
  ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fillStyle=isMe?'#fff':'#ffffff55';ctx.fill();
  // HP bar (others)
  if(!isMe){
    const bw=36;ctx.fillStyle='#00000070';ctx.fillRect(-bw/2,-BRAD-12,bw,5);
    const hp=Math.max(0,p.hp)/PHP;
    ctx.fillStyle=hp>.5?'#00ff50':hp>.25?'#ff8020':'#ff2020';
    ctx.fillRect(-bw/2,-BRAD-12,bw*hp,5);
  }
  ctx.font='9px Share Tech Mono';ctx.textAlign='center';
  ctx.fillStyle=isMe?p.color:'#ffffff70';
  ctx.fillText(p.name||'???',0,-BRAD-16);
  ctx.restore();
}

function drawMM(){
  const sc=110/(MAP_W*TILE);
  mmX.clearRect(0,0,110,110);mmX.fillStyle='#001008cc';mmX.fillRect(0,0,110,110);
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    if(map[ty][tx]===1){mmX.fillStyle='#2a5a2a';mmX.fillRect(tx*TILE*sc,ty*TILE*sc,TILE*sc,TILE*sc);}
  }
  for(const[pid,p]of Object.entries(players)){
    if(!p.alive)continue;
    mmX.beginPath();mmX.arc(p.x*sc,p.y*sc,pid===myId?4:3,0,Math.PI*2);
    mmX.fillStyle=pid===myId?'#00ff50':p.color;mmX.fill();
  }
}

function loop(now){
  requestAnimationFrame(loop);
  if(!gameRunning)return;
  const me=players[myId];
  // Movement
  if(me&&me.alive){
    let dx=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0)+joyDx;
    let dy=(keys['KeyS']||keys['ArrowDown']?1:0)-(keys['KeyW']||keys['ArrowUp']?1:0)+joyDy;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len>1){dx/=len;dy/=len;}
    if(dx||dy){
      const nx=me.x+dx*PSPEED,ny=me.y+dy*PSPEED;
      if(!collidesMap(nx,me.y,BRAD-1))me.x=nx;
      if(!collidesMap(me.x,ny,BRAD-1))me.y=ny;
      if(joyActive)me.angle=Math.atan2(dy,dx);
    }
    if(!joyActive)me.angle=Math.atan2(mouse.y-canvas.height/2,mouse.x-canvas.width/2);
    camX=me.x-canvas.width/2;camY=me.y-canvas.height/2;
  }
  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(isWall(b.x,b.y)||b.life<=0){bullets.splice(i,1);continue;}
    if(b.ownerId===myId){
      for(const[pid,p]of Object.entries(players)){
        if(pid===myId||!p.alive)continue;
        const dx=b.x-p.x,dy=b.y-p.y;
        if(dx*dx+dy*dy<BRAD*BRAD){
          bullets.splice(i,1);
          sb.from('hits').upsert({id:'h_'+myId+'_'+Date.now(),target_id:pid,data:{from:myId,dmg:BDmg,t:Date.now()},created_at:new Date().toISOString()}).then();
          killfeed('► Попал в '+(p.name||pid).slice(-6));
          break;
        }
      }
    }
  }
  // Sync
  if(now-lastSync>100){lastSync=now;pushPlayer();}
  if(now-lastPoll>300){lastPoll=now;pollPlayers();}
  if(now-lastHPoll>250){lastHPoll=now;pollHits();}
  if(now-lastBPoll>400){lastBPoll=now;pollBullets();}

  draw();
}

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}

async function startGame(){
  const st=document.getElementById('status');
  st.style.display='block';
  document.getElementById('menu').style.display='none';

  // Init Supabase
  try{
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    st.textContent='ПОДКЛЮЧЕНО ✓';
    setTimeout(()=>st.style.display='none',1500);
  }catch(e){
    st.textContent='ОШИБКА ПОДКЛЮЧЕНИЯ';
    st.style.color='#ff4040';
    return;
  }

  canvas.style.display='block';
  document.getElementById('hud').style.display='block';
  document.getElementById('xhair').style.display='block';
  document.getElementById('joyZone').style.display='block';
  document.getElementById('shootBtn').style.display='flex';
  document.getElementById('reloadBtn').style.display='flex';

  resize();window.addEventListener('resize',resize);

  const pos=randSpawn();
  const ci=parseInt(myId.slice(-2),36)%COLORS.length;
  players[myId]={id:myId,x:pos.x,y:pos.y,hp:PHP,angle:0,color:COLORS[ci],alive:true,name:'P_'+myId.slice(-4).toUpperCase()};
  camX=pos.x-window.innerWidth/2;camY=pos.y-window.innerHeight/2;

  setHP(PHP);setAmmo();setupInput();gameRunning=true;
  requestAnimationFrame(loop);

  window.addEventListener('beforeunload',()=>{sb.from('players').delete().eq('id',myId).then();});
}
</script>
