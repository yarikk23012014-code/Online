<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZONE // SHOOTER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'Share Tech Mono',monospace;overflow:hidden;width:100vw;height:100vh;user-select:none;touch-action:none;}

/* MENU */
#menu{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0a1a0a,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#menu::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,80,.03) 2px,rgba(0,255,80,.03) 4px);pointer-events:none;}
.mtitle{font-family:'Orbitron',monospace;font-size:clamp(2.5rem,7vw,5rem);font-weight:900;color:#00ff50;letter-spacing:.3em;text-shadow:0 0 20px #00ff50,0 0 60px #00ff5060;animation:flicker 4s infinite;margin-bottom:.2em;}
.msub{color:#00ff5070;letter-spacing:.4em;font-size:.8rem;margin-bottom:3rem;}
@keyframes flicker{0%,95%,100%{opacity:1}96%{opacity:.5}97%{opacity:1}98%{opacity:.3}}
.mbtn{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;letter-spacing:.25em;padding:.9rem 2.5rem;border:2px solid #00ff50;background:transparent;color:#00ff50;cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;transition:all .2s;margin:.4rem;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.mbtn::before{content:'';position:absolute;inset:0;background:#00ff50;transform:scaleX(0);transform-origin:left;transition:transform .2s;z-index:-1;}
.mbtn:hover{color:#000;}.mbtn:hover::before{transform:scaleX(1);}
.mbtn.primary{background:#00ff5015;}
.mcontrols{position:absolute;bottom:1.5rem;color:#00ff5045;font-size:.7rem;letter-spacing:.12em;text-align:center;line-height:2;}

/* CANVAS */
#gameCanvas{display:none;position:absolute;inset:0;}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;display:none;}
.hcorner{position:absolute;padding:.8rem 1rem;color:#00ff50;font-size:.72rem;letter-spacing:.08em;}
.htl{top:0;left:0;}.htr{top:0;right:0;text-align:right;}
.hbar{width:140px;height:5px;background:#00ff5015;border:1px solid #00ff5040;margin-top:3px;overflow:hidden;}
.hbar-fill{height:100%;background:linear-gradient(90deg,#ff2020,#ff8020,#00ff50);background-size:300% 100%;background-position:right;transition:width .3s,background-position .3s;}
.hammo{font-size:1.4rem;font-family:'Orbitron',monospace;font-weight:700;}
.hammo span{font-size:.7rem;opacity:.45;}

/* MINIMAP */
#minimap{position:absolute;top:.8rem;right:.8rem;width:110px;height:110px;border:1px solid #00ff5040;background:#001008cc;overflow:hidden;pointer-events:none;}
#mmCanvas{width:100%;height:100%;}

/* CROSSHAIR */
#xhair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:11;display:none;}

/* KILLFEED */
#kfeed{position:absolute;top:4.5rem;right:.8rem;width:190px;pointer-events:none;display:flex;flex-direction:column;gap:3px;}
.ke{background:#00001880;border-left:2px solid #ff4040;padding:3px 7px;font-size:.68rem;color:#ff9090;animation:kfade 3s forwards;}
@keyframes kfade{0%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0;transform:translateX(18px)}}

/* DAMAGE */
#dmgv{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#ff000055 100%);pointer-events:none;z-index:9;opacity:0;transition:opacity .1s;}

/* JOYSTICK */
#joyZone{position:absolute;bottom:30px;left:30px;width:130px;height:130px;pointer-events:all;z-index:20;display:none;}
#joyBase{position:absolute;inset:0;border-radius:50%;background:#00ff5012;border:2px solid #00ff5040;}
#joyStick{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#00ff5060,#00ff5025);border:2px solid #00ff5080;top:50%;left:50%;transform:translate(-50%,-50%);transition:none;}

/* SHOOT BTN */
#shootBtn{position:absolute;bottom:40px;right:40px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff404060,#ff202025);border:2px solid #ff404080;font-family:'Orbitron',monospace;font-weight:700;color:#ff6060;font-size:.7rem;letter-spacing:.05em;cursor:pointer;pointer-events:all;z-index:20;display:none;touch-action:none;}
#shootBtn:active{background:radial-gradient(circle at 35% 35%,#ff4040aa,#ff202060);}

/* RELOAD BTN */
#reloadBtn{position:absolute;bottom:140px;right:50px;width:55px;height:55px;border-radius:50%;background:#00ff5015;border:2px solid #00ff5060;font-family:'Share Tech Mono',monospace;color:#00ff50;font-size:.65rem;cursor:pointer;pointer-events:all;z-index:20;display:none;}

/* DEATH */
#death{display:none;position:absolute;inset:0;background:#00000095;z-index:50;align-items:center;justify-content:center;flex-direction:column;}
#death h2{font-family:'Orbitron',monospace;color:#ff2040;font-size:clamp(1.8rem,5vw,3rem);text-shadow:0 0 30px #ff2040;margin-bottom:.8rem;animation:flicker 2s infinite;}
#respawn{color:#ff204070;font-size:.9rem;letter-spacing:.3em;}

/* RELOAD INDICATOR */
#reloadBar{position:absolute;bottom:50%;left:50%;transform:translate(-50%,0);pointer-events:none;z-index:12;display:none;flex-direction:column;align-items:center;gap:4px;}
#reloadBarFill{width:0%;height:4px;background:#00ff50;}
#reloadBarTrack{width:120px;height:4px;background:#00ff5020;border:1px solid #00ff5040;}
#reloadText{font-size:.7rem;color:#00ff50;letter-spacing:.2em;}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <div class="mtitle">// ZONE</div>
  <div class="msub">Multiplayer · Top-Down</div>
  <button class="mbtn primary" onclick="startGame()">► ИГРАТЬ</button>
  <div class="mcontrols">WASD / Джойстик — движение &nbsp;|&nbsp; Мышь / Кнопка — стрелять &nbsp;|&nbsp; R — перезарядка</div>
</div>

<!-- GAME -->
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hcorner htl">
    <div>HP</div>
    <div class="hbar"><div class="hbar-fill" id="hpFill"></div></div>
    <div id="hpNum" style="margin-top:3px;">100</div>
  </div>
  <div class="hcorner htr">
    <div class="hammo" id="ammoHud">30 <span>/ 90</span></div>

</div>

<div id="dmgv"></div>

<!-- CROSSHAIR -->
<div id="xhair">
  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" opacity=".85">
    <line x1="15" y1="2" x2="15" y2="11" stroke="#00ff50" stroke-width="1.5"/>
    <line x1="15" y1="19" x2="15" y2="28" stroke="#00ff50" stroke-width="1.5"/>
    <line x1="2" y1="15" x2="11" y2="15" stroke="#00ff50" stroke-width="1.5"/>
    <line x1="19" y1="15" x2="28" y2="15" stroke="#00ff50" stroke-width="1.5"/>

  </svg>

<!-- JOYSTICK -->
<div id="joyZone"><div id="joyBase"></div><div id="joyStick"></div></div>

<!-- BUTTONS -->
<button id="shootBtn" ontouchstart="touchShoot()" onmousedown="tryShoot()">ОГОНЬ</button>
<button id="reloadBtn" onclick="startReload()">RELOAD</button>

<!-- RELOAD BAR -->
<div id="reloadBar">
  <div id="reloadText">ПЕРЕЗАРЯДКА</div>
  <div id="reloadBarTrack"><div id="reloadBarFill"></div></div>
</div>

<!-- DEATH -->
<div id="death">
  <h2>ВЫ УБИТЫ</h2>
  <div id="respawn"></div>
</div>

<script>
// ═══════════════════════════════════════
//  ZONE — Top-Down Shooter
//  Supabase Realtime Multiplayer
// ═══════════════════════════════════════

const SUPABASE_URL = 'https://expysxwfhielbkbpbrbb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lIDOZq9OFDScGjzVO3XBmg_bU_WQw5w';

// ── Config ──
const TILE = 48, MAP_W = 32, MAP_H = 24;
const PSPEED = 3.0, BRAD = 14;
const BSPEED = 10, BDmg = 25, BLIFE = 70;
const PHP = 100, AMMO = 30, RESERVE = 90;
const RELOAD_MS = 2000;
const COLORS = ['#00e5ff','#ff5722','#e91e63','#8bc34a','#ffc107','#9c27b0','#03a9f4','#ff9800','#00ff50','#ff1744'];

// ── Supabase client (REST + Realtime) ──
let supaClient = null;
let realtimeChannel = null;

function initSupabase() {
  // Use the Supabase JS CDN
  supaClient = {
    async upsert(table, row) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(row)
      });
      return r.ok;
    },
    async delete(table, id) {
      await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
    },
    async getAll(table) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      return r.ok ? r.json() : [];
    },
    realtime(table, cb) {
      // Use Supabase Realtime via WebSocket
      const wsUrl = SUPABASE_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0';
      const ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        ws.send(JSON.stringify({topic:`realtime:public:${table}`,event:'phx_join',payload:{},ref:'1'}));
        setInterval(() => ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'})), 20000);
      };
      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE') {
            cb(msg.event, msg.payload.record, msg.payload.old_record);
          }
        } catch(ex) {}
      };
      return ws;
    }
  };
}

// ── Map ──
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildMap(seed) {
  const rng = mulberry32(seed);
  const m = Array.from({length: MAP_H}, (_, y) =>
    Array.from({length: MAP_W}, (_, x) =>
      (x===0||y===0||x===MAP_W-1||y===MAP_H-1) ? 1 : 0
    )
  );
  for (let i = 0; i < 90; i++) {
    const bx = Math.floor(rng()*(MAP_W-4))+2;
    const by = Math.floor(rng()*(MAP_H-4))+2;
    if (Math.abs(bx-MAP_W/2)<3&&Math.abs(by-MAP_H/2)<3) continue;
    m[by][bx] = 1;
  }
  for (let i = 0; i < 25; i++) {
    const bx = Math.floor(rng()*(MAP_W-6))+3;
    const by = Math.floor(rng()*(MAP_H-6))+3;
    if (Math.abs(bx-MAP_W/2)<4&&Math.abs(by-MAP_H/2)<4) continue;
    m[by][bx] = 1;
    if (rng()>.5) m[by][bx+1] = 1;
    if (rng()>.5) m[by+1][bx] = 1;
  }
  return m;
}

const MAP_SEED = 12345;
const map = buildMap(MAP_SEED);

function isWall(wx, wy) {
  const tx = Math.floor(wx/TILE), ty = Math.floor(wy/TILE);
  if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return true;
  return map[ty]?.[tx] === 1;
}
function collidesMap(cx, cy, r) {
  const pts = [[cx-r,cy],[cx+r,cy],[cx,cy-r],[cx,cy+r],
    [cx-r*.7,cy-r*.7],[cx+r*.7,cy-r*.7],[cx-r*.7,cy+r*.7],[cx+r*.7,cy+r*.7]];
  return pts.some(([px,py]) => isWall(px,py));
}

function randSpawn() {
  const rng = mulberry32(Date.now()&0xFFFFFF);
  for (let i=0; i<300; i++) {
    const tx = Math.floor(rng()*(MAP_W-2))+1;
    const ty = Math.floor(rng()*(MAP_H-2))+1;
    if (map[ty]?.[tx]===0) return {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2};
  }
  return {x:TILE*3,y:TILE*3};
}

// ── State ──
const myId = 'p_'+Math.random().toString(36).slice(2,9);
let players = {};
let bullets = [];
let keys = {};
let mouse = {x:0,y:0};
let camX=0, camY=0;
let myAmmo=AMMO, myRes=RESERVE;
let reloading=false, reloadStart=0;
let gameRunning=false;
let joyDx=0, joyDy=0;
let lastSync=0;
let shootCooldown=0;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmC = document.getElementById('mmCanvas');
const mmX = mmC.getContext('2d');

// ── HUD helpers ──
function setHP(hp) {
  const p = Math.max(0,hp)/PHP*100;
  document.getElementById('hpFill').style.width = p+'%';
  document.getElementById('hpFill').style.backgroundPosition = (100-p)+'% center';
  document.getElementById('hpNum').textContent = Math.max(0,Math.round(hp));
}
function setAmmo() {
  document.getElementById('ammoHud').innerHTML = `${myAmmo} <span>/ ${myRes}</span>`;
}
function flashDmg() {
  const v=document.getElementById('dmgv');
  v.style.opacity='1';
  setTimeout(()=>v.style.opacity='0',200);
}
function killfeed(msg) {
  const f=document.getElementById('kfeed');
  const el=document.createElement('div');
  el.className='ke'; el.textContent=msg;
  f.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ── Joystick ──
let joyActive=false, joyId=-1, joyBX=0, joyBY=0;
function setupJoystick() {
  const zone=document.getElementById('joyZone');
  const stick=document.getElementById('joyStick');
  const R=55;
  function jStart(e) {
    e.preventDefault();
    const t=e.changedTouches?e.changedTouches[0]:e;
    const rect=zone.getBoundingClientRect();
    joyBX=rect.left+rect.width/2;
    joyBY=rect.top+rect.height/2;
    joyId=t.identifier??-1;
    joyActive=true;
  }
  function jMove(e) {
    e.preventDefault();
    if(!joyActive)return;
    const touches=e.changedTouches??[e];
    for(const t of touches){
      if((t.identifier??-1)!==joyId&&e.changedTouches)continue;
      let dx=t.clientX-joyBX, dy=t.clientY-joyBY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>R){dx=dx/dist*R;dy=dy/dist*R;}
      stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joyDx=dx/R; joyDy=dy/R;
    }
  }
  function jEnd(e) {
    e.preventDefault();
    joyActive=false; joyDx=0; joyDy=0;
    stick.style.transform='translate(-50%,-50%)';
  }
  zone.addEventListener('touchstart',jStart,{passive:false});
  zone.addEventListener('mousedown',jStart);
  window.addEventListener('touchmove',jMove,{passive:false});
  window.addEventListener('mousemove',jMove);
  window.addEventListener('touchend',jEnd);
  window.addEventListener('mouseup',jEnd);
}

// ── Input ──
function setupInput() {
  document.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyR') startReload();
  });
  document.addEventListener('keyup',e=>keys[e.code]=false);
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
  });
  canvas.addEventListener('mousedown',e=>{if(e.button===0)tryShoot();});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  setupJoystick();
}

function touchShoot(e) { tryShoot(); }

function tryShoot() {
  const me=players[myId];
  if(!me||!me.alive||reloading) return;
  if(myAmmo<=0){startReload();return;}
  const now=Date.now();
  if(now-shootCooldown<130) return;
  shootCooldown=now;
  myAmmo--; setAmmo();

  const scx=canvas.width/2, scy=canvas.height/2;
  let angle;
  // On mobile use joystick direction for aim if moving, else last angle
  if(joyActive&&(joyDx||joyDy)) {
    angle=Math.atan2(joyDy,joyDx);
  } else {
    angle=Math.atan2(mouse.y-scy,mouse.x-scx);
  }

  const b={
    id:myId+'_'+now+'_'+Math.random().toString(36).slice(2,5),
    ownerId:myId,
    x:me.x+Math.cos(angle)*(BRAD+5),
    y:me.y+Math.sin(angle)*(BRAD+5),
    vx:Math.cos(angle)*BSPEED,
    vy:Math.sin(angle)*BSPEED,
    life:BLIFE,
  };
  bullets.push(b);
  pushBullet(b);
}

function startReload() {
  if(reloading||myRes<=0||myAmmo===AMMO) return;
  reloading=true; reloadStart=Date.now();
  const rb=document.getElementById('reloadBar');
  rb.style.display='flex';
}

// ── Supabase sync ──
async function pushPlayer() {
  const me=players[myId];
  if(!me) return;
  await supaClient.upsert('players',{id:myId, data:me, updated_at:new Date().toISOString()});
}

async function pushBullet(b) {
  await supaClient.upsert('bullets',{id:b.id, data:b, created_at:new Date().toISOString()});
}

async function pushHit(targetId, dmg) {
  const id='hit_'+myId+'_'+Date.now();
  await supaClient.upsert('hits',{id, target_id:targetId, data:{from:myId,dmg,t:Date.now()}, created_at:new Date().toISOString()});
}

let processedHits=new Set();
async function pollHits() {
  try {
    const rows=await supaClient.getAll('hits');
    const mine=rows.filter(r=>r.target_id===myId&&!processedHits.has(r.id));
    for(const r of mine){
      processedHits.add(r.id);
      applyDmg(r.data.dmg);
      await supaClient.delete('hits',r.id);
    }
  } catch(e){}
}

async function pollBullets() {
  try {
    const rows=await supaClient.getAll('bullets');
    const now=Date.now();
    for(const r of rows){
      const b=r.data;
      if(b.ownerId===myId) continue;
      if(!bullets.find(x=>x.id===b.id)){
        // Only add if fresh (within 2s)
        if(now-(b.created||now)<2000) bullets.push({...b,external:true});
      }
    }
  } catch(e){}
}

async function pollPlayers() {
  try {
    const rows=await supaClient.getAll('players');
    const now=Date.now();
    for(const r of rows){
      if(r.id===myId) continue;
      // Only show players updated in last 10s
      const age=now-new Date(r.updated_at).getTime();
      if(age<10000) players[r.id]=r.data;
      else delete players[r.id];
    }
  } catch(e){}
}

function applyDmg(dmg) {
  const me=players[myId];
  if(!me||!me.alive) return;
  me.hp-=dmg; flashDmg(); setHP(me.hp);
  if(me.hp<=0) die();
}

function die() {
  const me=players[myId];
  if(!me) return;
  me.alive=false;
  document.getElementById('death').style.display='flex';
  let t=5;
  document.getElementById('respawn').textContent=`ВОЗРОЖДЕНИЕ ЧЕРЕЗ ${t}...`;
  const iv=setInterval(()=>{
    t--;
    if(t<=0){clearInterval(iv);respawn();}
    else document.getElementById('respawn').textContent=`ВОЗРОЖДЕНИЕ ЧЕРЕЗ ${t}...`;
  },1000);
}

function respawn() {
  const pos=randSpawn();
  const me=players[myId];
  me.x=pos.x; me.y=pos.y; me.hp=PHP; me.alive=true;
  myAmmo=AMMO; myRes=RESERVE; reloading=false;
  setHP(PHP); setAmmo();
  document.getElementById('death').style.display='none';
  document.getElementById('reloadBar').style.display='none';
}

// ── Draw ──
const FLOOR = ['#0c180c','#0d1a0d','#0e1c0e'];
const WTOP = '#1a3a1a';
const WSIDE = '#0d200d';
const WALL_H = 18;

function draw() {
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(-camX,-camY);

  // Floor
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++) {
    if(map[ty][tx]===0){
      ctx.fillStyle=FLOOR[(tx+ty)%3];
      ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);
      ctx.strokeStyle='#1a301a25'; ctx.lineWidth=.5;
      ctx.strokeRect(tx*TILE,ty*TILE,TILE,TILE);
    }
  }

  // Walls — fake 3D top-down
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++) {
    if(map[ty][tx]!==1) continue;
    const wx=tx*TILE, wy=ty*TILE;
    // South face
    ctx.fillStyle=WSIDE;
    ctx.fillRect(wx,wy+TILE,TILE,WALL_H);
    // East face
    ctx.fillStyle='#112a11';
    ctx.fillRect(wx+TILE,wy,WALL_H,TILE);
    // Top
    ctx.fillStyle=WTOP;
    ctx.fillRect(wx,wy,TILE,TILE);
    ctx.strokeStyle='#2a5a2a60'; ctx.lineWidth=1;
    ctx.strokeRect(wx+2,wy+2,TILE-4,TILE-4);
    // Corner accent
    ctx.fillStyle='#3a6a3a80';
    ctx.fillRect(wx+4,wy+4,8,8);
  }

  // Bullets
  for(const b of bullets){
    const own=b.ownerId===myId;
    ctx.save();
    ctx.shadowColor=own?'#ffff40':'#ff6060';
    ctx.shadowBlur=8;
    ctx.fillStyle=own?'#ffff90':'#ff9090';
    ctx.beginPath(); ctx.arc(b.x,b.y,3.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=.35;
    ctx.fillStyle=own?'#ffff00':'#ff4040';
    ctx.beginPath(); ctx.arc(b.x-b.vx*2.5,b.y-b.vy*2.5,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Players
  for(const [pid,p] of Object.entries(players)){
    if(p.alive) drawPlayer(p, pid===myId);
  }

  ctx.restore();

  // Reload UI
  if(reloading){
    const pct=Math.min(1,(Date.now()-reloadStart)/RELOAD_MS);
    document.getElementById('reloadBarFill').style.width=(pct*100)+'%';
  }

  drawMM();
}

function drawPlayer(p, isMe) {
  ctx.save();
  ctx.translate(p.x,p.y);
  // Shadow
  ctx.beginPath();
  ctx.ellipse(3,7,BRAD,BRAD*.45,0,0,Math.PI*2);
  ctx.fillStyle='#00000055'; ctx.fill();
  // Body glow
  if(isMe){ctx.shadowColor=p.color;ctx.shadowBlur=14;}
  ctx.beginPath(); ctx.arc(0,0,BRAD,0,Math.PI*2);
  ctx.fillStyle=isMe?p.color:p.color+'99'; ctx.fill();
  ctx.strokeStyle=isMe?'#fff':'#ffffff55'; ctx.lineWidth=isMe?2:1.5; ctx.stroke();
  // Gun barrel
  ctx.rotate(p.angle);
  ctx.fillStyle=isMe?'#ffffffdd':'#ffffff66';
  ctx.fillRect(BRAD-3,-3,16,6);
  ctx.fillStyle=isMe?'#fff':'#ffffff55';
  ctx.fillRect(BRAD+10,-2,4,4);
  // Center dot
  ctx.rotate(-p.angle);
  ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2);
  ctx.fillStyle=isMe?'#fff':'#ffffff55'; ctx.fill();
  // HP bar (others)
  if(!isMe){
    const bw=36;
    ctx.fillStyle='#00000070'; ctx.fillRect(-bw/2,-BRAD-11,bw,5);
    const hp=Math.max(0,p.hp)/PHP;
    ctx.fillStyle=hp>.5?'#00ff50':hp>.25?'#ff8020':'#ff2020';
    ctx.fillRect(-bw/2,-BRAD-11,bw*hp,5);
  }
  // Name
  ctx.font='9px Share Tech Mono'; ctx.textAlign='center';
  ctx.fillStyle=isMe?p.color:'#ffffff70';
  ctx.fillText(p.name||'???',0,-BRAD-15);
  ctx.restore();
}

function drawMM() {
  const sc=110/(MAP_W*TILE);
  mmX.clearRect(0,0,110,110);
  mmX.fillStyle='#001008cc'; mmX.fillRect(0,0,110,110);
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
    if(map[ty][tx]===1){
      mmX.fillStyle='#2a5a2a';
      mmX.fillRect(tx*TILE*sc,ty*TILE*sc,TILE*sc,TILE*sc);
    }
  }
  for(const [pid,p] of Object.entries(players)){
    if(!p.alive) continue;
    mmX.beginPath();
    mmX.arc(p.x*sc,p.y*sc,3.5,0,Math.PI*2);
    mmX.fillStyle=pid===myId?'#00ff50':p.color;
    mmX.fill();
    if(pid===myId){
      mmX.strokeStyle='#00ff5080'; mmX.lineWidth=1;
      mmX.beginPath();
      mmX.arc(p.x*sc,p.y*sc,5,0,Math.PI*2);
      mmX.stroke();
    }
  }
}

// ── Game Loop ──
let lastPoll=0, lastHitPoll=0, lastBPoll=0;
function loop(now) {
  if(!gameRunning){requestAnimationFrame(loop);return;}
  requestAnimationFrame(loop);

  const me=players[myId];

  // Movement
  if(me&&me.alive){
    let dx=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0);
    let dy=(keys['KeyS']||keys['ArrowDown']?1:0)-(keys['KeyW']||keys['ArrowUp']?1:0);
    // Joystick override/add
    dx+=joyDx; dy+=joyDy;
    // Normalize
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len>1){dx/=len;dy/=len;}
    const nx=me.x+dx*PSPEED, ny=me.y+dy*PSPEED;
    if(!collidesMap(nx,me.y,BRAD-1)) me.x=nx;
    if(!collidesMap(me.x,ny,BRAD-1)) me.y=ny;

    // Aim: mouse on desktop, joystick on mobile
    const scx=canvas.width/2, scy=canvas.height/2;
    if(joyActive&&(dx||dy)) me.angle=Math.atan2(dy,dx);
    else me.angle=Math.atan2(mouse.y-scy,mouse.x-scx);

    // Camera
    camX=me.x-canvas.width/2;
    camY=me.y-canvas.height/2;

    // Reload tick
    if(reloading){
      if(now-reloadStart>=RELOAD_MS){
        reloading=false;
        const need=AMMO-myAmmo, take=Math.min(need,myRes);
        myAmmo+=take; myRes-=take;
        setAmmo();
        document.getElementById('reloadBar').style.display='none';
      }
    }
  }

  // Bullet update
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(isWall(b.x,b.y)||b.life<=0){bullets.splice(i,1);continue;}
    // Hit other players
    if(b.ownerId===myId){
      for(const [pid,p] of Object.entries(players)){
        if(pid===myId||!p.alive) continue;
        const dx=b.x-p.x, dy=b.y-p.y;
        if(dx*dx+dy*dy<BRAD*BRAD){
          bullets.splice(i,1);
          pushHit(pid,BDmg);
          killfeed(`► Попал в ${(p.name||pid).slice(-6)}`);
          break;
        }
      }
    }
  }

  // Periodic sync
  if(now-lastSync>100){lastSync=now;pushPlayer();}
  if(now-lastPoll>500){lastPoll=now;pollPlayers();}
  if(now-lastHitPoll>300){lastHitPoll=now;pollHits();}
  if(now-lastBPoll>600){lastBPoll=now;pollBullets();}

  draw();
}

// ── Resize ──
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

// ── Start ──
async function startGame(){
  document.getElementById('menu').style.display='none';
  canvas.style.display='block';
  document.getElementById('hud').style.display='block';
  document.getElementById('xhair').style.display='block';
  document.getElementById('joyZone').style.display='block';
  document.getElementById('shootBtn').style.display='flex';
  document.getElementById('reloadBtn').style.display='flex';

  resize();
  window.addEventListener('resize',resize);
  initSupabase();

  const pos=randSpawn();
  const colorIdx=parseInt(myId.slice(-2),36)%COLORS.length;
  players[myId]={
    id:myId, x:pos.x, y:pos.y, hp:PHP,
    angle:0, color:COLORS[colorIdx],
    alive:true, name:'P_'+myId.slice(-4).toUpperCase()
  };
  camX=pos.x-window.innerWidth/2;
  camY=pos.y-window.innerHeight/2;

  setHP(PHP); setAmmo();
  setupInput();
  gameRunning=true;
  requestAnimationFrame(loop);

  window.addEventListener('beforeunload',()=>{
    supaClient?.delete('players',myId);
  });
}

function showControls(){}
